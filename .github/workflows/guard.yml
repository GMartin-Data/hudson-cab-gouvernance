name: guard

on:
  push:
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail if any file under data/ is tracked
        run: |
          tracked="$(git ls-files data/)"
          if [ -n "$tracked" ]; then
            echo "::error::nothing under data/ may ever be tracked:"
            echo "$tracked"
            exit 1
          fi
          echo "Nothing tracked under data/."
